input:
  # Paths are relative to this YAML file.
  lipidomics: Lipid_AlignmentTable.csv
  format: msdial
  annotation_cols: "1:35"
  header_rows: 5
  data_start_row: 6

analysis:
  normalization: none
  aggregation: sum
  group_column: class
  exclude_groups:
    - Blank
    - Quality control

pathway:
  # Omit network to render the three bundled lipid-only pathways:
  # remodeling, ceramide, and global.
  timeout_seconds: 90

plot:
  type: dot
  x_order:
    - "2"
    - "12"
    - "19"
    - "24"
  font_size: 20
  strip_font_size: 10
  p_label_font_size: 3.5
  y_axis_label: Abundance
  svg_width: 4.5
  svg_height: 4.5
  palette:
    "2": "#1B9E77"
    "12": "#D95F02"
    "19": "#7570B3"
    "24": "#E7298A"
  dot:
    point_size: 2.0
    jitter_width: 0.15
    alpha: 0.9
    show_median: true
    median_size: 0.7
    median_width: 0.6
    median_color: "#222222"

output:
  directory: pathway_projection
  paper_size: A4
  orientation: landscape
